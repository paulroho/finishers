<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Finish Line Capture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="overlays/stop-overlay.css">
  <link rel="stylesheet" href="overlays/data-overlay.css">
</head>
<body>

  <h1>Race Timer</h1>

  <div class="timer" id="timer">00:00</div>

  <div class="buttons">
    <button id="startButton">Start</button>
    <button id="captureButton" disabled>Capture</button>
    <button id="stopButton" disabled>Stop</button>
    <button id="showDataButton">Show Data</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Time</th>
        <th>Comment</th>
      </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>

  <!-- Stop Confirmation Overlay -->
  <div id="stopOverlay" class="overlay hidden">
    <div class="overlay-content">
      <button class="close-btn" onclick="closeStopOverlay()">✕</button>
      <h2>Type 'STOP' to confirm</h2>
      <input type="text" id="stopInput" placeholder="Type STOP">
      <button id="confirmStopButton" disabled>Stop it!</button>
    </div>
  </div>

  <!-- Data Display Overlay -->
  <div id="dataOverlay" class="overlay hidden">
    <div class="overlay-content">
      <button class="close-btn" onclick="closeDataOverlay()">✕</button>
      <pre id="csvData"></pre>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
